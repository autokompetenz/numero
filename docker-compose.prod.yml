# Déploiement Numivo (API + front + PostgreSQL).
# Usage : cp .env.production.example .env.production && docker compose -f docker-compose.prod.yml up -d --build
# L'API et le front ne sont accessibles que via le reverse proxy TLS placé devant le service web.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: numivo
      POSTGRES_DB: numivo
      TZ: UTC
    volumes:
      - numivo_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numivo -d numivo"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [numivo]

  migrate:
    build:
      context: ./server
      target: migrate
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [numivo]

  # Amorçage ponctuel (profil `tools`) : pays, services, tarification, admin.
  # docker compose -f docker-compose.prod.yml --env-file .env.production \
  #   --profile tools run --rm seed
  seed:
    build:
      context: ./server
      target: seed
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"
    networks: [numivo]

  api:
    build:
      context: ./server
      target: runtime
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [numivo]

  web:
    build:
      context: .
      args:
        VITE_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
    networks: [numivo]

volumes:
  numivo_pgdata_prod:
    name: numivo_pgdata_prod

networks:
  numivo:
    driver: bridge
